# Every push to main: run the engine tests, rebuild the pages, deploy site/ to Cloudflare Pages.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit).
# The account ID is not a secret; a CLOUDFLARE_ACCOUNT_ID secret, if set, overrides it.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/engine.test.js
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        run: npx -y wrangler@4 pages deploy site --project-name avantgarde-site --branch main --commit-hash "$GITHUB_SHA" --commit-message "${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '424121e0b72c1a32e08729028250a935' }}
