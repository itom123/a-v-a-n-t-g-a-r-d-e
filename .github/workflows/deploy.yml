# Every push to main: run the engine and Worker tests, rebuild the pages, deploy site/ to Cloudflare Pages,
# then (once set up, see workers/lab-results/README.md) the AG LAB results Worker.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit; for the Worker also
# Workers Scripts, D1, Workers Routes and Email Sending > Edit).
# The account ID is not a secret; a CLOUDFLARE_ACCOUNT_ID secret, if set, overrides it.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/engine.test.js
      - run: node tests/secrets.test.js
      - run: node workers/lab-results/selftest.js
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        run: npx -y wrangler@4 pages deploy site --project-name avantgarde-site --branch main --commit-hash "$GITHUB_SHA" --commit-message "${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '424121e0b72c1a32e08729028250a935' }}
      # Off until the one-time setup in workers/lab-results/README.md is done; then set the
      # repository variable LAB_WORKER to "on" (Settings > Secrets and variables > Actions > Variables).
      # A token without D1 permission fails here with code 7403. Warn instead of stopping, so the Worker
      # still deploys: it sends the emails even when it can't store the lead.
      - name: Apply AG LAB database migrations
        if: ${{ vars.LAB_WORKER == 'on' }}
        continue-on-error: true
        working-directory: workers/lab-results
        run: npx -y wrangler@4 d1 migrations apply ag-lab --remote || { echo "::warning::D1 migrations failed. Give LAB_WORKER_API_TOKEN (or CLOUDFLARE_API_TOKEN) the D1 Edit permission (see workers/lab-results/README.md)."; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LAB_WORKER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '424121e0b72c1a32e08729028250a935' }}
      - name: Deploy the AG LAB results Worker
        if: ${{ vars.LAB_WORKER == 'on' }}
        working-directory: workers/lab-results
        run: npx -y wrangler@4 deploy
        env:
          # A separate token for the Worker (Workers Scripts, Workers Routes, D1, Email Sending: Edit) if one is set;
          # otherwise the Pages token, which then needs those permissions too.
          CLOUDFLARE_API_TOKEN: ${{ secrets.LAB_WORKER_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '424121e0b72c1a32e08729028250a935' }}
